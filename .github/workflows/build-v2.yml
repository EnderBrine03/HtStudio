name: Build HtStudio V2

on:
  workflow_dispatch:
  push:
    branches: [v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build onedir
        working-directory: v2
        run: |
          pyinstaller --noconfirm --clean --noconsole --onedir --name HtStudioV2 main.py
          dir dist\HtStudioV2

      - name: Pack sample-project (sidecar)
        working-directory: v2
        shell: cmd
        run: |
          dir sample-project
          python pack.py dist\HtStudioV2\HtStudioV2.exe sample-project dist\HtStudioV2\OrnekV2.exe --sidecar
          dir dist\HtStudioV2

      - name: Zip release folder
        working-directory: v2
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HtStudioV2\*" -DestinationPath "dist\HtStudioV2-win.zip" -Force
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HtStudioV2-win
          path: |
            v2/dist/HtStudioV2-win.zip
            v2/dist/HtStudioV2/**
          if-no-files-found: error
          retention-days: 30
