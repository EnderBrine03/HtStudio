name: Build HtStudio Runtime EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.8: Windows 7'de çalışan son resmi sürüm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name HtStudioRuntime --add-data "shell;shell" bootstrap.py

      - name: List output
        shell: bash
        run: |
          ls -la dist/ || true
          find . -name "*.exe" -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HtStudioRuntime
          path: dist/HtStudioRuntime.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HtStudioRuntime.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
