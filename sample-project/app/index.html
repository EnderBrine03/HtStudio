  <h1>Merhaba HtStudio 👋</h1>
  <p id="t">Bu sayfa launcher içindeki gömülü Chromium'da çalışıyor.</p>
  <button onclick="n++;localStorage.n=n;t.textContent='Tıklama: '+n">Tıkla</button>
